<main class="page-view">
  <section class="page-section page-section--hero membership-hero">
    <app-editable-text
      tag="p"
      className="kicker"
      [multiline]="false"
      contentKey="membership.hero.kicker"
      fallback="Mitglied werden"
    />
    <app-editable-text
      tag="h1"
      className="display-title display-title--small"
      [multiline]="false"
      contentKey="membership.hero.title"
      fallback="Fördern oder aktiv mittragen."
    />
    <app-editable-text
      tag="p"
      className="lead"
      contentKey="membership.hero.lead"
      fallback="Bei vaida is not dead gibt es nicht nur einen Weg rein. Du kannst die Struktur finanziell stärken oder selbst aktiv Teil davon werden."
    />
    <div class="membership-pills">
      <span>
        <app-editable-text
          tag="span"
          [multiline]="false"
          contentKey="membership.hero.pill.0"
          fallback="Fördermitgliedschaft"
        />
      </span>
      <span>
        <app-editable-text
          tag="span"
          [multiline]="false"
          contentKey="membership.hero.pill.1"
          fallback="Aktive Mitgliedschaft"
        />
      </span>
      <span>
        <app-editable-text
          tag="span"
          [multiline]="false"
          contentKey="membership.hero.pill.2"
          fallback="DIY-Struktur in Viechtach"
        />
      </span>
    </div>
    <div class="action-row">
      <a class="button button--solid" href="#mitgliedsanfrage">
        <app-editable-text
          tag="span"
          [multiline]="false"
          contentKey="membership.hero.form_cta"
          fallback="Zum Formular"
        />
      </a>
      <a class="button button--ghost" [href]="'mailto:' + contactEmail">
        <app-editable-text
          tag="span"
          [multiline]="false"
          contentKey="membership.hero.mail_cta"
          fallback="Direkt mailen"
        />
      </a>
    </div>
  </section>

  <section class="page-section">
    <div class="section-header">
      <app-editable-text
        tag="p"
        className="kicker"
        [multiline]="false"
        contentKey="membership.types.kicker"
        fallback="Mitgliedschaftsarten"
      />
      <app-editable-text
        tag="h2"
        className="section-title"
        contentKey="membership.types.title"
        fallback="Im Grunde gibt es zwei Formen."
      />
      <app-editable-text
        tag="p"
        className="body-copy"
        contentKey="membership.types.body"
        fallback="Nicht jede Person will auf dieselbe Weise beteiligt sein. Deshalb ist hier nur kurz aufgeschrieben, was mit Fördermitgliedschaft und aktiver Mitgliedschaft jeweils gemeint ist."
      />
    </div>

    <div class="membership-mode-list">
      @for (track of membershipTracks; track track.label; let i = $index) {
        <article
          class="membership-mode"
          [class.membership-mode--active]="track.kind === 'aktiv'"
          [class.membership-mode--foerder]="track.kind === 'foerder'"
        >
          <div class="membership-mode__media">
            <div class="membership-mode__media-inner">
              <img [src]="track.imageSrc" [alt]="track.imageAlt" />
              <span class="membership-mode__symbol">{{ track.symbol }}</span>
            </div>
          </div>

          <div class="membership-mode__content">
            <app-editable-text
              tag="p"
              className="membership-mode__label"
              [multiline]="false"
              [contentKey]="'membership.tracks.' + i + '.label'"
              [fallback]="track.label"
            />
            <app-editable-text
              tag="h3"
              [contentKey]="'membership.tracks.' + i + '.title'"
              [fallback]="track.title"
            />
            <app-editable-text
              tag="p"
              className="membership-mode__intro"
              [contentKey]="'membership.tracks.' + i + '.intro'"
              [fallback]="track.intro"
            />

            <ul class="membership-mode__list">
              @for (detail of track.details; track detail; let detailIndex = $index) {
                <li>
                  <app-editable-text
                    tag="span"
                    [contentKey]="'membership.tracks.' + i + '.details.' + detailIndex"
                    [fallback]="detail"
                  />
                </li>
              }
            </ul>

            <app-editable-text
              tag="p"
              className="note-line"
              [contentKey]="'membership.tracks.' + i + '.note'"
              [fallback]="track.note"
            />

            <a class="membership-mode__link" href="#mitgliedsanfrage" (click)="setMembershipType(track.label)">
              <app-editable-text
                tag="span"
                [multiline]="false"
                [contentKey]="'membership.tracks.' + i + '.cta'"
                [fallback]="track.cta"
              />
            </a>
          </div>
        </article>
      }
    </div>
  </section>

  <section id="mitgliedsanfrage" class="page-section membership-request-section">
    <article class="surface-card membership-form-card">
      <app-editable-text
        tag="p"
        className="kicker"
        [multiline]="false"
        contentKey="membership.form.kicker"
        fallback="Kontaktformular"
      />
      <app-editable-text
        tag="h2"
        className="section-title"
        contentKey="membership.form.title"
        fallback="Wenn du magst, schreib uns einfach."
      />
      <app-editable-text
        tag="p"
        className="body-copy"
        contentKey="membership.form.body"
        fallback="Das Formular öffnet nur dein Mailprogramm und setzt die wichtigsten Angaben schon in Betreff und Nachricht an info@vaidaisnotdead.de. Eine kurze Mail mit ein paar Zeilen reicht völlig."
      />

      <form
        class="membership-form"
        (submit)="$event.preventDefault(); sendMembershipMail(membershipType.value, name.value, email.value, phone.value, focus.value, message.value)"
      >
        <label class="form-field">
          <app-editable-text
            tag="span"
            [multiline]="false"
            contentKey="membership.form.field.type"
            fallback="Mitgliedschaftsart"
          />
          <select
            #membershipType
            name="membershipType"
            required
            [value]="selectedMembershipType()"
            (change)="setMembershipType(membershipType.value)"
          >
            <option value="">Bitte auswählen</option>
            <option value="Fördermitgliedschaft">Fördermitgliedschaft</option>
            <option value="Aktive Mitgliedschaft">Aktive Mitgliedschaft</option>
          </select>
        </label>

        <label class="form-field">
          <app-editable-text
            tag="span"
            [multiline]="false"
            contentKey="membership.form.field.name"
            fallback="Name"
          />
          <input #name type="text" name="name" autocomplete="name" required />
        </label>

        <label class="form-field">
          <app-editable-text
            tag="span"
            [multiline]="false"
            contentKey="membership.form.field.email"
            fallback="E-Mail"
          />
          <input #email type="email" name="email" autocomplete="email" required />
        </label>

        <label class="form-field">
          <app-editable-text
            tag="span"
            [multiline]="false"
            contentKey="membership.form.field.phone"
            fallback="Telefon / Signal / Insta"
          />
          <input #phone type="text" name="phone" autocomplete="tel" />
        </label>

        <label class="form-field">
          <app-editable-text
            tag="span"
            [multiline]="false"
            contentKey="membership.form.field.focus"
            fallback="Wie willst du beitragen?"
          />
          <input
            #focus
            type="text"
            name="focus"
            placeholder="z. B. finanziell unterstützen, Theke, Technik, Awareness, Booking"
          />
        </label>

        <label class="form-field">
          <app-editable-text
            tag="span"
            [multiline]="false"
            contentKey="membership.form.field.message"
            fallback="Nachricht"
          />
          <textarea
            #message
            name="message"
            rows="6"
            placeholder="Erzähl kurz, was du suchst oder wie du dich einbringen willst."
            required
          ></textarea>
        </label>

        <div class="action-row action-row--form">
          <button class="button button--solid" type="submit">
            <app-editable-text
              tag="span"
              [multiline]="false"
              contentKey="membership.form.submit"
              fallback="Anfrage per Mail vorbereiten"
            />
          </button>
          <a class="button button--ghost" [href]="'mailto:' + contactEmail">
            <app-editable-text
              tag="span"
              [multiline]="false"
              contentKey="membership.form.mail_cta"
              fallback="Ohne Formular schreiben"
            />
          </a>
        </div>
      </form>
    </article>
  </section>
</main>
