<main class="page-view">
  <section class="page-section page-section--hero">
    <app-editable-text
      tag="p"
      className="kicker"
      [multiline]="false"
      contentKey="gallery.hero.kicker"
      fallback="Galerie"
    />
    <app-editable-text
      tag="h1"
      className="display-title display-title--small"
      contentKey="gallery.hero.title"
      fallback="Motive, Flyer und erste öffentliche Eindrücke."
    />
    <app-editable-text
      tag="p"
      className="lead"
      contentKey="gallery.hero.lead"
      fallback="Noch keine voll ausgebaute Fotochronik, aber bereits eine eigene Seite für Bildmaterial, Artwork und visuelle Hinweise auf die Richtung des Clubs."
    />
    <app-editable-text
      tag="p"
      className="body-copy"
      contentKey="gallery.hero.body"
      fallback="Die Motive hier stammen aus dem bestehenden öffentlichen Auftritt und können später durch echte Eventfotos, Plakate und Archivmaterial ergänzt werden."
    />
  </section>

  <section class="page-section">
    <div class="gallery-grid">
      @for (item of galleryItems; track item.src; let i = $index) {
        <figure
          class="media-tile"
          [class.media-tile--poster]="i === 0"
          [class.media-tile--logo]="i === 1"
        >
          <img [src]="item.src" [alt]="item.alt" />
          <figcaption class="media-tile__caption">
            <app-editable-text
              tag="span"
              [contentKey]="'gallery.items.' + i + '.caption'"
              [fallback]="item.caption"
            />
          </figcaption>
        </figure>
      }
    </div>
  </section>
</main>
