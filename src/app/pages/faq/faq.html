<main class="page-view">
  <section class="page-section page-section--hero">
    <app-editable-text
      tag="p"
      className="kicker"
      [multiline]="false"
      contentKey="faq.hero.kicker"
      fallback="FAQ"
    />

    <app-editable-text
      tag="h1"
      className="display-title display-title--small"
      [multiline]="false"
      contentKey="faq.hero.title"
      fallback="Häufig gestellte Fragen"
    />
  </section>

  <section class="page-section">
    <div class="faq-list">
      @for (item of faqItems; track item.question; let i = $index) {
        <details class="faq-item">
          <summary>
            <app-editable-text
              tag="span"
              [multiline]="false"
              [contentKey]="'faq.items.' + i + '.question'"
              [fallback]="item.question"
            />
          </summary>
          <app-editable-text
            tag="p"
            [contentKey]="'faq.items.' + i + '.answer'"
            [fallback]="item.answer"
          />
        </details>
      }
    </div>
  </section>
</main>
