<main class="page-view">
  <section class="page-section page-section--hero">
    <p class="kicker">FAQ</p>
    <h1 class="display-title display-title--small">Kurz, direkt und ohne Vereinsdeutsch.</h1>
    <p class="lead">
      Die häufigsten Fragen können hier knapp beantwortet werden, damit neue Leute schnell
      verstehen, worum es geht und wie sie andocken können.
    </p>
  </section>

  <section class="page-section">
    <div class="faq-list">
      @for (item of faqItems; track item.question) {
        <details class="faq-item">
          <summary>{{ item.question }}</summary>
          <p>{{ item.answer }}</p>
        </details>
      }
    </div>
  </section>
</main>
