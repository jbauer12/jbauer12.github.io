<main class="page-view">
  <section class="page-section page-section--hero">
    <app-editable-text
      tag="p"
      className="kicker"
      [multiline]="false"
      contentKey="faq.hero.kicker"
      fallback="FAQ"
    />

    <app-editable-text
      tag="h1"
      className="display-title display-title--small"
      [multiline]="false"
      contentKey="faq.hero.title"
      fallback="Häufig gestellte Fragen"
    />
  </section>

  <section class="page-section">
    @if (errorMessage()) {
      <div class="info-strip">{{ errorMessage() }}</div>
    }

    @if (isLoading()) {
      <div class="info-strip">FAQ werden geladen.</div>
    }

    <div class="faq-list">
      @for (item of faqItems(); track item.id) {
        <details class="faq-item">
          <summary>
            <span>{{ item.question }}</span>
          </summary>
          <p>{{ item.answer }}</p>
        </details>
      }
    </div>
  </section>
</main>
