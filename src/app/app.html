<div class="site-shell">
  <header class="site-header">
    <div class="site-header__frame">
      <div class="site-header__topline">
        <a class="site-brand" routerLink="/" (click)="closeMobileMenu()">
          <img
            class="site-brand__logo"
            src="/vaidaisnotdead-logo.png"
            alt="Logo von Vaida is not dead e.V."
          />
          <span class="site-brand__copy">
            <app-editable-text
              tag="span"
              className="site-brand__title"
              [multiline]="false"
              [showTrigger]="false"
              contentKey="app.brand.title"
              fallback="Vaida is not dead e.V."
            />
            <app-editable-text
              tag="span"
              className="site-brand__meta"
              [multiline]="false"
              [showTrigger]="false"
              contentKey="app.brand.meta"
              fallback="Viechtach · Bayerischer Wald"
            />
          </span>
        </a>

        <button
          class="site-menu-toggle"
          type="button"
          [attr.aria-expanded]="isMobileMenuOpen()"
          aria-controls="site-nav"
          aria-label="Navigation umschalten"
          (click)="toggleMobileMenu()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <a class="site-header__mail" [href]="'mailto:' + contactEmail">
        {{ contactEmail }}
      </a>
    </div>

    <nav
      id="site-nav"
      class="site-nav"
      [class.site-nav--open]="isMobileMenuOpen()"
      aria-label="Hauptnavigation"
    >
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          (click)="closeMobileMenu()"
        >
          <app-editable-text
            tag="span"
            [multiline]="false"
            [showTrigger]="false"
            [contentKey]="'app.nav.' + $index + '.label'"
            [fallback]="item.label"
          />
        </a>
      }
    </nav>
  </header>

  <router-outlet />

  <footer class="site-footer">
    <div>
      <app-editable-text
        tag="p"
        className="site-footer__title"
        [multiline]="false"
        contentKey="app.footer.title"
        fallback="Vaida is not dead e.V."
      />
      <app-editable-text
        tag="p"
        className="site-footer__text"
        contentKey="app.footer.text"
        fallback="Jugend- und Subkultur in Viechtach. Direkt, reduziert und auf echte Abende ausgerichtet."
      />
    </div>

    <div class="site-footer__links">
      @for (link of socialLinks; track link.label) {
        <a [href]="link.href" [attr.target]="link.external ? '_blank' : null" [attr.rel]="link.external ? 'noreferrer noopener' : null">
          <app-editable-text
            tag="span"
            [multiline]="false"
            [showTrigger]="false"
            [contentKey]="'app.social.' + $index + '.label'"
            [fallback]="link.label"
          />
        </a>
      }
    </div>

    <div class="site-footer__legal">
      @for (link of legalLinks; track link.path) {
        <a [routerLink]="link.path">{{ link.label }}</a>
      }
    </div>
  </footer>

  <app-cookie-banner />
</div>
